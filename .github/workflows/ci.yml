# Framework smoke + wiki e2e + lint scans on every push/PR.
#
# Lint posture: 0 warnings, 0 errors. Bug-class ESLint rules + Hadolint
# strict + ShellCheck strict. The ESLint config is tuned to flag real
# bugs without forcing a stylistic-cleanup sweep on legacy code.
#
# Output posture: every step's full output is shown — no `>/dev/null`,
# no `--quiet`, no `--silent`. Operators reading a failed run see what
# actually fired without re-running locally.

name: CI

on:
  push:
    branches: [main]
    tags:     ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Framework smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Show Node + npm version
        run: node --version && npm --version

      - name: Run framework smoke
        run: node test/smoke.js

  wiki-e2e:
    name: Wiki e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve wiki framework dep (file:../..)
        working-directory: examples/wiki
        run: npm install --no-package-lock --omit=dev --install-links

      - name: Run wiki e2e
        working-directory: examples/wiki
        run: node test/e2e.js

  lint-eslint:
    name: ESLint (lib + examples + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run ESLint (max-warnings 0)
        # --max-warnings 0 fails on any warning. The flat config in
        # eslint.config.mjs flags bug-class rules only; new code that
        # introduces undef references, unreachable code, regex bugs,
        # etc., fails CI here before review.
        run: npx --yes eslint@9 --max-warnings 0 .

  lint-hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Hadolint (strict, all severities)
        # `--no-fail` is OFF; any error or warning fails the job.
        # Config at .hadolint.yaml ignores the small set of rules
        # that conflict with our intentional patterns.
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: examples/wiki/Dockerfile
          config:     .hadolint.yaml
          format:     tty
          no-fail:    false
          failure-threshold: warning

  lint-shellcheck:
    name: ShellCheck (shell scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect shell scripts
        id: sh
        run: |
          # ludeeus/action-shellcheck@2.0.0 fails when there are no
          # *.sh files (shellcheck itself exits 3 on empty input).
          # Skip the lint step when nothing matches; flip back on the
          # moment a tracked .sh appears.
          count=$(git ls-files '*.sh' | wc -l)
          echo "Tracked .sh files: $count"
          git ls-files '*.sh' || true
          echo "found=$count" >> "$GITHUB_OUTPUT"

      - name: Run ShellCheck
        if: steps.sh.outputs.found != '0'
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: style
          format:   tty
          check_together: 'yes'
