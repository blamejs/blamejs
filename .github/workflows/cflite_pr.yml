name: ClusterFuzzLite PR fuzzing

# Runs coverage-guided fuzzing (jazzer.js + libFuzzer) against every
# `fuzz/*.fuzz.js` harness on every PR touching `lib/` or `fuzz/`.
# Catches new bugs the harness mutator finds within a 5-minute budget;
# the matching `cflite_batch.yml` workflow does the deep continuous
# run on a daily schedule.
#
# Findings ship to the PR as inline annotations + crash artifacts;
# regression corpus persists in the workflow-artifact store across
# runs so an input that broke a previous PR remains in the seed set
# for future ones.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'fuzz/**'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ none ]   # jazzer.js is pure-JS — native sanitizers don't apply
    steps:
      - name: Checkout
        # ClusterFuzzLite's external-CI mode looks for the project
        # under $GITHUB_WORKSPACE/storage/<repo-name>/ — not the
        # default checkout root. The path override puts the source
        # where build_fuzzers expects to find .clusterfuzzlite/.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0
        with:
          path: storage/blamejs

      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c  # main 2026-05-10 (JS fixes post-v1)
        with:
          language: javascript
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c  # main 2026-05-10 (JS fixes post-v1)
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
