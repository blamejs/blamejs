name: Fuzz

# Runs the hand-rolled fuzz harnesses under fuzz/ in a matrix:
#
#   - On pull-requests touching lib/ or fuzz/: 60s budget per target
#     (fast feedback, blocks the merge on a finding).
#   - On daily schedule:                       300s budget per target
#     (deeper paths, surfaces issues PR-budget can't reach).
#   - On manual dispatch:                      configurable via inputs.
#
# Each finding fails its matrix shard with a reproducer in the run log.

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 5 * * *'           # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      budget_ms:
        description: 'Per-target budget (milliseconds)'
        required: false
        default: '120000'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - safe-json
          - safe-url
          - safe-jsonpath
          - guard-csv
          - guard-html
          - guard-json
          - guard-yaml
          - guard-xml
          - guard-svg
          - guard-markdown
          - guard-email
          - parsers__safe-toml
          - parsers__safe-yaml
          - parsers__safe-xml
          - parsers__safe-ini
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.0.0
        with:
          node-version: '24'

      - name: Resolve fuzz budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "budget_ms=300000" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "budget_ms=${{ inputs.budget_ms }}" >> "$GITHUB_OUTPUT"
          else
            echo "budget_ms=60000" >> "$GITHUB_OUTPUT"
          fi

      - name: Fuzz (${{ matrix.target }})
        env:
          FUZZ_BUDGET_MS: ${{ steps.budget.outputs.budget_ms }}
        run: node fuzz/${{ matrix.target }}.fuzz.js

  fuzz-summary:
    name: Fuzz summary
    needs: fuzz
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          if [ "${{ needs.fuzz.result }}" = "success" ]; then
            echo "All fuzz harnesses clean."
          else
            echo "::error::One or more fuzz targets reported findings — see the matrix shards above for reproducers."
            exit 1
          fi
