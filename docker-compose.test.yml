# Test-only infrastructure for blamejs integration tests.
#
# Provides real backends so the bespoke wire-protocol clients
# (lib/redis-client.js and future pg-wire / mysql-wire / mongo-wire
# adapters) can be exercised against the production code path instead
# of mocks. Also covers every protocol declared as deferred in the
# framework's protocolDispatcher blocks (queue: redis/sqs/amqp/nats,
# log-stream: syslog) and the bring-your-own-client gaps for
# external-db (postgres/mysql/mongo) and object-store (sigv4 → MinIO).
#
# Bring up:
#   docker compose -f docker-compose.test.yml up --wait
# Tear down (preserve volumes):
#   docker compose -f docker-compose.test.yml down
# Tear down (wipe state):
#   docker compose -f docker-compose.test.yml down -v
#
# Validate everything is responding from the host:
#   node scripts/check-services.js
#
# All ports bind to 127.0.0.1 only — no LAN exposure.
# Credentials are deterministic test-only values; this file MUST NOT
# be referenced from the starter app or production deploys.

services:

  redis:
    image: redis:7-alpine
    container_name: blamejs-test-redis
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - "redis-server"
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--protected-mode"
      - "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: blamejs-test-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: blamejs
      POSTGRES_PASSWORD: blamejs_test
      POSTGRES_DB: blamejs_test
    volumes:
      - blamejs_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blamejs -d blamejs_test"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: blamejs-test-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: blamejs_test_root
      MYSQL_USER: blamejs
      MYSQL_PASSWORD: blamejs_test
      MYSQL_DATABASE: blamejs_test
    volumes:
      - blamejs_test_mysqldata:/var/lib/mysql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysqladmin ping -h 127.0.0.1 -u blamejs -pblamejs_test --silent"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: blamejs-test-mongo
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: blamejs
      MONGO_INITDB_ROOT_PASSWORD: blamejs_test
    volumes:
      - blamejs_test_mongodata:/data/db
    healthcheck:
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--username"
        - "blamejs"
        - "--password"
        - "blamejs_test"
        - "--authenticationDatabase"
        - "admin"
        - "--eval"
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: blamejs-test-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: blamejs
      MINIO_ROOT_PASSWORD: blamejs_test_password
    command:
      - "server"
      - "/data"
      - "--console-address"
      - ":9001"
    volumes:
      - blamejs_test_miniodata:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --spider --quiet http://127.0.0.1:9000/minio/health/live"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: blamejs-test-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: blamejs
      RABBITMQ_DEFAULT_PASS: blamejs_test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    container_name: blamejs-test-nats
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command:
      - "-js"
      - "-m"
      - "8222"
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "--quiet"
        - "http://127.0.0.1:8222/healthz"
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  syslog:
    image: balabit/syslog-ng:latest
    container_name: blamejs-test-syslog
    ports:
      - "127.0.0.1:5514:514/udp"
      - "127.0.0.1:5514:514/tcp"
      - "127.0.0.1:6514:6514/tcp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x syslog-ng > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  blamejs_test_pgdata:
  blamejs_test_mysqldata:
  blamejs_test_mongodata:
  blamejs_test_miniodata:
