{% extends "_layout" %}
{% block content %}
<h1>Admin sign-in</h1>
{% if error %}<p style="color:#b00020"><strong>{{ error }}</strong></p>{% endif %}
<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="csrf" value="{{ csrfToken }}">
  <p><label>Email<br><input type="email" name="email" required autocomplete="email" autofocus></label></p>
  <p><label>Password<br><input type="password" name="password" required autocomplete="current-password"></label></p>
  <p><button type="submit">Sign in</button></p>
</form>
<p class="muted">No public registration. The wiki ships with one admin seeded from <code>WIKI_ADMIN_EMAIL</code> + <code>WIKI_ADMIN_PASSWORD</code> at first boot.</p>
{% endblock %}
