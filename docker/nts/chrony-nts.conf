# NTS-KE + NTPv4 server for the live NTS tests (RFC 8915).
# NTS-KE on 4460/tcp; NTP on 12301/udp. chrony sends an NTPv4 Port record
# whenever its NTP port is not 123, so the client follows it to 12301.
port 12301
ntsport 4460
ntsservercert /certs/nts.crt
ntsserverkey /certs/nts.key
local stratum 10
allow all
