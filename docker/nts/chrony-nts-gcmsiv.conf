# NTS server that accepts only AEAD id 30 (AEAD_AES_128_GCM_SIV), which the
# client does not implement. A client offering 15 and 29 receives an empty
# AEAD record and refuses the handshake with nts/no-aead.
port 12302
ntsport 4460
ntsservercert /certs/nts.crt
ntsserverkey /certs/nts.key
ntsaeads 30
local stratum 10
allow all
