# clamd for the blamejs integration stack.
#
# StreamMaxLength is 1M rather than the 25M default so the INSTREAM
# size-limit reply is reachable from a test without sending 25 MB.

LogTime yes
LogClean no
LogSyslog no
LogVerbose no

# TCPAddr is deliberately unset, which listens on every interface. Pinning it
# to 0.0.0.0 binds IPv4 only, which leaves the compose file's [::1]:3310
# mapping dead and fails the image's own health probe, whose `nc localhost`
# resolves to ::1 inside the container.
TCPSocket 3310
Foreground yes

# The image's own health probe, clamdcheck.sh, talks to the unix socket.
# Without this it reports "Unable to contact server" while the TCP listener
# above is serving normally, and the container never becomes healthy.
LocalSocket /tmp/clamd.sock

DatabaseDirectory /var/lib/clamav
MaxThreads 4
MaxQueue 20
ReadTimeout 60
CommandReadTimeout 30

StreamMaxLength 1M
MaxScanSize 10M
MaxFileSize 10M
MaxRecursion 8
MaxFiles 100
